<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro Contesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&family=Newsreader:ital,opsz,wght@0,6..72,380;0,6..72,500;1,6..72,380&display=swap">
<style>
:root{
  --paper:#fbfcfd; --rail:#f2f4f7; --raised:#ffffff; --sunken:#ebeef2;
  --ink:#11161b; --prose:#1a212a; --said:#4a545f; --muted:#636d77; --faint:#98a1aa;
  --line:#e6eaef; --line-strong:#c6ced7; --tick:#b6c0ca;
  --accent:#23577f; --solid:#23577f; --on-solid:#ffffff;
  --ok:#2c7355; --warn:#966c14; --crit:#a83c34; --crit-wash:#fbf0ef;
  --ui:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1216; --rail:#0a0d10; --raised:#161a1f; --sunken:#080a0d;
    --ink:#e8edf3; --prose:#dfe6ee; --said:#aab4bf; --muted:#8d97a2; --faint:#68717b;
    --line:#1e242a; --line-strong:#323b44; --tick:#3d4753;
    --accent:#84b7e5; --solid:#2b6396; --on-solid:#f4f8fc;
    --ok:#52b489; --warn:#c9993f; --crit:#d96b61; --crit-wash:#211716;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1216; --rail:#0a0d10; --raised:#161a1f; --sunken:#080a0d;
  --ink:#e8edf3; --prose:#dfe6ee; --said:#aab4bf; --muted:#8d97a2; --faint:#68717b;
  --line:#1e242a; --line-strong:#323b44; --tick:#3d4753;
  --accent:#84b7e5; --solid:#2b6396; --on-solid:#f4f8fc;
  --ok:#52b489; --warn:#c9993f; --crit:#d96b61; --crit-wash:#211716;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14.5px;
  line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* il misuratore incornicia l'intera finestra: e' il telaio, non un componente */
.gauge{position:fixed;top:0;left:0;right:0;height:2px;background:var(--sunken);z-index:30}
.gauge i{display:block;height:100%;width:0;background:var(--ok);
  transition:width .4s cubic-bezier(.4,0,.2,1),background .4s ease}
.gauge i.warn{background:var(--warn)} .gauge i.crit{background:var(--crit)}
.gauge u{position:absolute;top:0;height:100%;width:1px;background:var(--line-strong);opacity:.9}

.app{display:grid;grid-template-columns:214px minmax(0,1fr);height:100dvh;padding-top:2px}

/* ───────── indice ───────── */
.rail{background:var(--rail);display:flex;flex-direction:column;min-height:0}
.rail-top{display:flex;align-items:center;gap:8px;padding:20px 20px 18px}
.mark{width:15px;height:15px;flex:none;color:var(--accent)}
.wordmark{font-size:12.5px;font-weight:600;letter-spacing:.005em}
.new{margin:0 14px 20px;padding:7px 12px;border-radius:4px;border:1px solid var(--line-strong);
  font-size:13px;font-weight:450;color:var(--muted);text-align:center;transition:color .14s,border-color .14s}
.new:hover{color:var(--ink);border-color:var(--muted)}
.rail-tag{padding:0 20px 8px}
.list{flex:1;overflow-y:auto;padding:0 12px 16px;min-height:0;display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:5px 8px;
  border-radius:3px;color:var(--muted);font-size:13px;transition:color .14s,background .14s}
.item:hover{color:var(--ink)}
.item[aria-current="true"]{color:var(--ink);font-weight:500;background:var(--raised)}
.item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-n{font-family:var(--mono);font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ───────── testata ───────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:20px;padding:0 34px;height:56px;flex:none}
.head-title{font-size:13.5px;font-weight:500;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.head-right{margin-left:auto;display:flex;align-items:center;gap:22px;flex:none}
/* strumento: percentuale incisa, scala graduata, lettura assoluta.
   E' la ragione d'essere del prodotto, quindi e' l'unica cosa disegnata. */
.instr{display:flex;align-items:center;gap:13px;white-space:nowrap}
.instr-pct{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:-.02em;
  color:var(--muted);font-variant-numeric:tabular-nums;transition:color .35s ease}
.instr-pct.warn{color:var(--warn)} .instr-pct.crit{color:var(--crit)}
.scale{width:188px;height:24px;display:block;flex:none}
.scale .grad{stroke:var(--tick);stroke-width:1}
.scale .grad.maj{stroke:var(--line-strong)}
.scale .bed{fill:var(--sunken)}
.scale .lvl{fill:var(--ok);transition:width .45s cubic-bezier(.32,.72,0,1),fill .45s ease}
.scale .lvl.warn{fill:var(--warn)} .scale .lvl.crit{fill:var(--crit)}
.scale .thr{stroke:var(--ink);stroke-width:1.2;opacity:.5}
.instr-read{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.host{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--faint);
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none}
.led.on{background:var(--ok)}
.gear{color:var(--faint);font-size:14px;line-height:1;transition:color .14s}
.gear:hover{color:var(--ink)}

.alarm{margin:0 34px 4px;padding:11px 15px;background:var(--crit-wash);border-radius:5px;
  font-size:13px;color:var(--muted);line-height:1.5}
.alarm b{color:var(--crit);font-weight:600;font-family:var(--ui)}

/* ───────── trascrizione: la linea del tempo e' la spina dorsale ───────── */
.scroll{flex:1;overflow-y:auto;min-height:0}
.thread{position:relative;max-width:700px;margin:0 auto;padding:26px 34px 16px 68px}
.thread::before{content:"";position:absolute;left:40px;top:20px;bottom:14px;width:1px;background:var(--line-strong);
  -webkit-mask-image:linear-gradient(transparent,#000 26px,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(transparent,#000 26px,#000 calc(100% - 26px),transparent)}
.thread > *{position:relative;margin-bottom:30px}
.thread > *:last-child{margin-bottom:0}

/* segnaposto sulla linea: cavo = tu, pieno = modello, rombo = evento */
.turn::before{content:"";position:absolute;left:-31px;top:.55em;width:7px;height:7px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line-strong);box-sizing:border-box}
.turn.assistant::before{background:var(--line-strong)}

/* le tue parole in lineare, quelle del modello in tondo: chi parla si legge
   dal carattere, quindi le etichette di ruolo non servono */
.turn.user{font-size:14.5px;color:var(--said);font-weight:450}
.turn.assistant{font-family:var(--read);font-size:17.5px;line-height:1.66;color:var(--prose);
  letter-spacing:.002em;text-wrap:pretty;hyphens:auto}
.turn p{margin:0 0 .62em}
.turn p:last-child{margin-bottom:0}
.turn strong{font-weight:500;color:var(--ink)}
.turn pre{background:var(--sunken);border-radius:4px;padding:12px 14px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.55;margin:.65em 0;color:var(--ink)}
.turn code{font-family:var(--mono);font-size:.82em;background:var(--sunken);padding:1px 4px;border-radius:3px}
.turn pre code{background:none;padding:0;font-size:1em}
.meta{display:flex;gap:14px;align-items:center;margin-top:7px;opacity:0;transition:opacity .16s}
.turn:hover .meta,.turn:focus-within .meta{opacity:1}
.meta span{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.meta button{font-family:var(--ui);font-size:11px;color:var(--faint);transition:color .14s}
.meta button:hover{color:var(--accent)}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;
  margin-left:1px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fresh{animation:rise .26s cubic-bezier(.32,.72,0,1) both}
.turn.live::before{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* schermata iniziale: la targa dello strumento */
.thread.empty{padding-left:34px}
.thread.empty::before{display:none}
.plate{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;min-height:min(58vh,460px);text-align:center}
.plate svg{width:34px;height:34px;color:var(--line-strong)}
.plate-name{font-family:var(--read);font-size:20px;color:var(--muted);letter-spacing:.01em}
.plate-specs{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.plate-specs div{padding:11px 22px;display:flex;flex-direction:column;gap:5px;align-items:center}
.plate-specs div + div{border-left:1px solid var(--line)}
.plate-specs b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--said);
  font-variant-numeric:tabular-nums}

/* evento di compattazione: un rombo sulla linea e una riga di numeri */
.mark-ev::before{content:"";position:absolute;left:-30.5px;top:.35em;width:6px;height:6px;
  background:var(--paper);border:1px solid var(--line-strong);transform:rotate(45deg)}
.ev{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;margin-bottom:10px!important}
.ev b{color:var(--muted);font-weight:500}
.memo{font-family:var(--read);font-style:italic;color:var(--muted);font-size:15.5px;
  line-height:1.6;padding-left:1px;text-wrap:pretty}
.memo .tag{display:block;margin-bottom:6px;color:var(--accent)}
.memo p{margin:0 0 .5em}

/* errore: il rombo diventa rosso, il testo resta sobrio */
.fail::before{content:"";position:absolute;left:-30.5px;top:.4em;width:6px;height:6px;
  background:var(--crit);transform:rotate(45deg)}
.fail-t{font-size:14px;font-weight:600;color:var(--crit);margin-bottom:2px}
.fail-n{color:var(--muted);font-size:13.5px}
.fail-raw{font-family:var(--mono);font-size:11px;background:var(--sunken);border-radius:4px;
  padding:9px 11px;margin:9px 0;word-break:break-word;max-height:140px;overflow:auto;line-height:1.5}
.fail-fix{font-size:13px;color:var(--muted);line-height:1.5}

/* ───────── composer: nessuna scatola, solo un filetto ───────── */
.compose{flex:none;border-top:1px solid var(--line);padding:14px 34px 18px}
.compose-in{max-width:700px;margin:0 auto;padding:0 34px 0 68px;display:flex;align-items:flex-end;gap:14px}
.write{flex:1;background:none;border:none;resize:none;padding:6px 0;max-height:190px;min-height:34px;
  font-size:14.5px;line-height:1.55}
.write:focus{outline:none}
.write::placeholder{color:var(--faint)}
.go{color:var(--faint);font-size:13px;font-weight:500;padding:6px 2px;flex:none;transition:color .14s}
.go.armed{color:var(--accent)}
.go:disabled{opacity:.4;cursor:default}
.halt{color:var(--crit);font-size:13px;padding:6px 2px;flex:none}
.tips{max-width:700px;margin:9px auto 0;padding:0 34px 0 68px;display:flex;gap:18px;font-family:var(--mono);
  font-size:9.5px;color:var(--faint);letter-spacing:.04em}

/* ───────── impostazioni ───────── */
.veil{position:fixed;inset:0;background:rgba(6,9,12,.42);display:grid;place-items:center;padding:24px;z-index:40}
.dlg{background:var(--paper);border-radius:8px;width:min(520px,100%);max-height:min(88vh,780px);
  overflow:auto;box-shadow:0 24px 60px rgba(6,9,12,.26)}
.dlg-top{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 16px;
  position:sticky;top:0;background:var(--paper);z-index:1}
.dlg-title{font-size:15px;font-weight:600}
.dlg-body{padding:4px 26px 24px;display:grid;gap:18px}
.f{display:grid;gap:6px}
.f input,.f select,.f textarea{background:none;border:none;border-bottom:1px solid var(--line-strong);
  border-radius:0;padding:6px 0;width:100%;font-size:13.5px;transition:border-color .14s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-bottom-color:var(--accent)}
.f textarea{border:1px solid var(--line-strong);border-radius:4px;padding:9px 11px;resize:vertical}
.f small{font-size:11.5px;color:var(--faint);line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dlg-end{display:flex;gap:18px;justify-content:flex-end;padding:0 26px 24px;align-items:center}
.txt{font-size:13px;color:var(--muted);transition:color .14s}
.txt:hover{color:var(--ink)}
.save{background:var(--solid);color:var(--on-solid);border-radius:4px;padding:7px 16px;
  font-size:13px;font-weight:500;transition:filter .14s}
.save:hover{filter:brightness(1.1)}
.tools{display:flex;gap:18px;margin-right:auto}
.report{font-family:var(--mono);font-size:11px;background:var(--sunken);border-radius:4px;padding:10px 12px;
  white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;line-height:1.55}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:2px auto 0 0;width:214px;z-index:20;transform:translateX(-100%);
    transition:transform .2s}
  .rail[data-open="true"]{transform:none}
  .head,.compose,.alarm{padding-left:20px;padding-right:20px}
  .thread{padding-left:52px;padding-right:20px}
  .compose-in,.tips{padding-left:32px;padding-right:0}
  .thread::before{left:26px}
  .pair{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="gauge"><i id="gFill"></i><u id="gTick"></u></div>

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-top">
      <svg class="mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M1.5 11.5 A6.5 6.5 0 0 1 14.5 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="8" y1="11.5" x2="11.6" y2="6.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">Quadro Contesto</span>
    </div>
    <button class="new" id="newChat">Nuova chat</button>
    <div class="rail-tag tag">Conversazioni</div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <header class="head">
      <span class="head-title" id="headTitle"></span>
      <div class="head-right">
        <div class="instr">
          <span class="instr-pct" id="iPct">0%</span>
          <svg class="scale" viewBox="0 0 188 24" aria-hidden="true">
            <g transform="translate(0,2)"><line class="grad maj" x1="0.0" y1="0" x2="0.0" y2="5"/><line class="grad" x1="18.8" y1="0" x2="18.8" y2="3"/><line class="grad" x1="37.6" y1="0" x2="37.6" y2="3"/><line class="grad" x1="56.4" y1="0" x2="56.4" y2="3"/><line class="grad" x1="75.2" y1="0" x2="75.2" y2="3"/><line class="grad maj" x1="94.0" y1="0" x2="94.0" y2="5"/><line class="grad" x1="112.8" y1="0" x2="112.8" y2="3"/><line class="grad" x1="131.6" y1="0" x2="131.6" y2="3"/><line class="grad" x1="150.4" y1="0" x2="150.4" y2="3"/><line class="grad" x1="169.2" y1="0" x2="169.2" y2="3"/><line class="grad maj" x1="188.0" y1="0" x2="188.0" y2="5"/></g>
            <rect class="bed" x="0" y="11" width="188" height="7" rx="1.5"/>
            <rect class="lvl" id="iLvl" x="0" y="11" width="0" height="7" rx="1.5"/>
            <line class="thr" x1="141" y1="8.5" x2="141" y2="20.5"/>
          </svg>
          <span class="instr-read" id="iRead"></span>
        </div>
        <div class="host" id="host"></div>
        <button class="gear" id="openSettings" aria-label="Impostazioni" title="Impostazioni">⚙</button>
      </div>
    </header>
    <div class="alarm" id="alarm" hidden></div>

    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

    <div class="compose">
      <div class="compose-in">
        <textarea class="write" id="input" rows="1" placeholder="Scrivi un messaggio…"></textarea>
        <button class="halt" id="stop" hidden>Ferma</button>
        <button class="go" id="send">Invia</button>
      </div>
      <div class="tips">
        <span>Invio per inviare · Maiusc+Invio a capo</span>
        <span id="draftTok"></span>
      </div>
    </div>
  </main>
</div>

<div class="veil" id="veil" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-top">
      <span class="dlg-title" id="dlgTitle">Impostazioni</span>
      <button class="gear" id="closeSettings" aria-label="Chiudi">✕</button>
    </div>
    <div class="dlg-body">
      <div class="f">
        <label class="tag" for="sUrl">Indirizzo del server</label>
        <input id="sUrl" placeholder="http://127.0.0.1:5001" spellcheck="false">
        <small>Vuoto: modalità dimostrativa, senza server.</small>
      </div>
      <div class="pair">
        <div class="f"><label class="tag" for="sKey">Chiave API</label>
          <input id="sKey" type="password" placeholder="facoltativa" spellcheck="false"></div>
        <div class="f"><label class="tag" for="sApi">Tipo di API</label>
          <select id="sApi">
            <option value="auto">rilevamento automatico</option>
            <option value="openai">OpenAI-compatible</option>
            <option value="kobold">KoboldCpp</option>
          </select></div>
      </div>
      <div class="f"><label class="tag" for="sModel">Modello</label>
        <input id="sModel" placeholder="rilevato dal server" spellcheck="false"></div>
      <div class="pair">
        <div class="f"><label class="tag" for="sCtx">Finestra di contesto</label>
          <input id="sCtx" type="number" min="512" step="512">
          <small id="ctxNote">Deve combaciare con l'avvio del motore.</small></div>
        <div class="f"><label class="tag" for="sOut">Token in risposta</label>
          <input id="sOut" type="number" min="64" step="64"></div>
      </div>
      <div class="pair">
        <div class="f"><label class="tag" for="sTemp">Temperatura</label>
          <input id="sTemp" type="number" min="0" max="2" step="0.05"></div>
        <div class="f"><label class="tag" for="sKeep">Messaggi tenuti interi</label>
          <input id="sKeep" type="number" min="2" step="1"><small>Mai compattati.</small></div>
      </div>
      <div class="f"><label class="tag" for="sSys">Istruzioni di sistema</label>
        <textarea id="sSys" rows="3" spellcheck="false"></textarea></div>
      <div class="f">
        <label class="tag">Verifica del server</label>
        <div><button class="txt" id="probeBtn" style="text-decoration:underline;text-underline-offset:3px">Interroga il server</button></div>
        <div class="report" id="probeOut" hidden></div>
      </div>
    </div>
    <div class="dlg-end">
      <div class="tools">
        <button class="txt" id="exportBtn">Esporta</button>
        <button class="txt" id="importBtn">Importa</button>
        <button class="txt" id="themeBtn">Tema</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <button class="txt" id="cancelSettings">Annulla</button>
      <button class="save" id="saveSettings">Salva</button>
    </div>
  </div>
</div>

<script>
"use strict";
const LS = "quadro-contesto-v1";
const DEFAULTS = {url:"",key:"",api:"auto",model:"",ctx:8192,out:512,temp:0.7,keep:6,
  sys:"Sei un assistente di ricerca conciso e preciso. Rispondi in italiano."};
const TRIGGER = 0.75, TARGET = 0.45;
let S = {...DEFAULTS}, convs = [], activeId = null, streaming = null, probed = null;

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Number(n||0).toLocaleString("it");

function store(){
  try{
    const puliti = convs.map(c => { const {_visti, ...resto} = c; return resto; });
    localStorage.setItem(LS, JSON.stringify({S, convs:puliti, activeId}));
  }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS)||"null"); if(!d) return false;
    S = {...DEFAULTS, ...(d.S||{})}; convs = d.convs||[]; activeId = d.activeId;
    return convs.length > 0;
  }catch(e){ return false; }
}
function tok(t){ return t ? Math.ceil(Math.max(t.length/3.0, t.split(" ").length)) + 8 : 0; }
function ctxTokens(c){ return tok(S.sys) + c.messages.filter(m=>!m.archived).reduce((n,m)=>n+tok(m.content),0) + 8; }

function nuova(seed){
  const c = {id:uid(), title:"Nuova chat", messages:[], created:Date.now()};
  if(seed) Object.assign(c, seed);
  convs.unshift(c); activeId = c.id; return c;
}
const attiva = () => convs.find(c=>c.id===activeId) || convs[0];

function esempio(){
  return nuova({title:"Esempio — come si legge", messages:[
    {id:uid(), role:"user", content:"Il mio codice cliente è ZX-7741. Analizziamo i log di ieri sera."},
    {id:uid(), role:"assistant", content:"Annotato ZX-7741. Tre picchi di latenza fra le 21:40 e le 22:05, tutti su richieste sopra i 6.000 token.", archived:true},
    {id:uid(), role:"user", content:"E gli errori 400?", archived:true},
    {id:uid(), role:"assistant", content:"Quarantasette, tutti con lo stesso messaggio sul superamento della finestra di contesto.", archived:true},
    {id:uid(), role:"system", kind:"summary", compaction:{absorbed:3, before:7840, after:2110},
     content:"Codice cliente ZX-7741. Log di ieri sera: tre picchi di latenza fra 21:40 e 22:05, tutti sopra i 6.000 token. Quarantasette errori 400, tutti per superamento della finestra. Resta aperto se la soglia di compattazione sia troppo alta."},
    {id:uid(), role:"user", content:"Ti ricordi il mio codice cliente?"},
    {id:uid(), role:"assistant", content:"Sì: **ZX-7741**. È sopravvissuto alla compattazione perché il riassunto conserva i dati concreti invece di scartare i messaggi vecchi."},
    {id:uid(), role:"error", content:"400 · This model's maximum context length is 8192 tokens, however you requested 9314 tokens.",
     hint:"Il contesto non è stato ridotto prima dell'invio. Con la soglia al 75% questa richiesta sarebbe stata compattata prima di partire."}
  ]});
}

/* ───────── rete ───────── */
function headers(){
  const h = {"Content-Type":"application/json"};
  if(S.key){ h.Authorization = "Bearer " + S.key; h["X-API-Key"] = S.key; }
  return h;
}
async function get(path, ms=8000){
  const ac = new AbortController(), t = setTimeout(()=>ac.abort(), ms);
  try{
    const r = await fetch(S.url.replace(/\/$/,"") + path, {headers:headers(), signal:ac.signal});
    const txt = await r.text();
    try{ return {ok:r.ok, status:r.status, body:JSON.parse(txt)}; }
    catch(e){ return {ok:r.ok, status:r.status, body:txt}; }
  }catch(e){ return {ok:false, status:0, body:String(e)}; }
  finally{ clearTimeout(t); }
}
async function interroga(){
  if(!S.url) return null;
  const out = {api:null, model:null, vera:null, righe:[]};
  const oa = await get("/v1/models");
  if(oa.ok){ out.api="openai"; out.righe.push("/v1/models → "+oa.status);
    try{ out.model = oa.body.data[0].id; }catch(e){} }
  if(!out.api){
    const kb = await get("/api/v1/model");
    if(kb.ok){ out.api="kobold"; out.righe.push("/api/v1/model → "+kb.status);
      try{ out.model = kb.body.result; }catch(e){} }
  }
  const v = await get("/api/extra/true_max_context_length");
  if(v.ok && v.body && typeof v.body.value === "number"){
    out.vera = v.body.value; out.righe.push("true_max_context_length → "+out.vera);
  }
  probed = out; return out;
}
class ServerError extends Error{
  constructor(status, raw){
    super(status + " · " + String(raw||"").slice(0,500));
    this.status = status; this.raw = String(raw||"");
    this.contesto = /context length|maximum context|too long|exceed|max_model_len/i.test(this.raw);
  }
}
const senzaThink = t => String(t||"").replace(/<think>[\s\S]*?<\/think>/gi,"").replace(/^\s+/,"");

async function completa(messaggi, maxTok, onDelta, segnale){
  if(!S.url) return demo(messaggi, onDelta);
  const base = S.url.replace(/\/$/,"");
  const api = S.api === "auto" ? ((probed && probed.api) || "openai") : S.api;

  if(api === "kobold"){
    const prompt = messaggi.map(m => (m.role==="assistant" ? "### Risposta:\n" : "### Istruzione:\n")
      + m.content + "\n\n").join("") + "### Risposta:\n";
    const r = await fetch(base + "/api/v1/generate", {method:"POST", headers:headers(), signal:segnale,
      body:JSON.stringify({prompt, max_length:maxTok, temperature:S.temp})});
    const txt = await r.text();
    if(!r.ok) throw new ServerError(r.status, txt);
    let out = ""; try{ out = senzaThink(JSON.parse(txt).results[0].text); }
    catch(e){ throw new ServerError(r.status, txt); }
    onDelta && onDelta(out); return out;
  }

  const r = await fetch(base + "/v1/chat/completions", {method:"POST", headers:headers(), signal:segnale,
    body:JSON.stringify({model:S.model||undefined, messages:messaggi, max_tokens:maxTok,
      temperature:S.temp, stream:true})});
  if(!r.ok) throw new ServerError(r.status, await r.text());
  if(!r.body){ const j = await r.json(); const t = senzaThink(j.choices[0].message.content); onDelta&&onDelta(t); return t; }

  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", acc = "", inThink = false;
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const righe = buf.split("\n"); buf = righe.pop();
    for(const riga of righe){
      if(!riga.startsWith("data:")) continue;
      const d = riga.slice(5).trim();
      if(d === "[DONE]") continue;
      let delta = "";
      try{ delta = (((JSON.parse(d).choices||[{}])[0].delta)||{}).content || ""; }catch(e){ continue; }
      if(!delta) continue;
      if(/<think>/i.test(delta)) inThink = true;
      if(inThink){
        if(/<\/think>/i.test(delta)){ inThink = false; delta = delta.split(/<\/think>/i).pop(); }
        else continue;
      }
      if(!delta) continue;
      acc += delta; onDelta && onDelta(delta);
    }
  }
  return acc;
}
async function demo(messaggi, onDelta){
  const ultimo = (messaggi[messaggi.length-1]||{}).content || "";
  const testo = /zx-?7741/i.test(JSON.stringify(messaggi))
    ? "Il tuo codice cliente è ZX-7741. (Modalità dimostrativa: nessun server collegato — impostane uno da ⚙.)"
    : "Modalità dimostrativa: non c'è nessun server collegato, quindi questa risposta è finta. Apri le impostazioni e inserisci l'indirizzo del tuo server. Hai scritto: " + JSON.stringify(ultimo.slice(0,110));
  for(const p of testo.split(" ")){ await new Promise(r=>setTimeout(r,16)); onDelta && onDelta(p+" "); }
  return testo;
}

/* ───────── compattazione ───────── */
function daCompattare(c){
  const attivi = c.messages.filter(m=>!m.archived);
  const blocco = attivi.slice(0, Math.max(0, attivi.length - S.keep));
  while(blocco.length && attivi[blocco.length] && attivi[blocco.length].role === "tool") blocco.pop();
  return blocco;
}
async function compatta(c){
  const blocco = daCompattare(c);
  if(blocco.length < 2) return {stato:"noop"};
  const testo = blocco.map(m => (m.kind==="summary" ? "RIASSUNTO PRECEDENTE" : m.role.toUpperCase()) + ": " + m.content).join("\n\n");
  let riassunto = "";
  try{
    riassunto = await completa([
      {role:"system", content:"Comprimi la conversazione conservando TUTTO ciò che serve a proseguirla: obiettivi, decisioni, fatti, nomi, identificativi esatti, URL, numeri, questioni aperte. Denso, in italiano. Nessun commento."},
      {role:"user", content:"Riassumi:\n\n" + testo.slice(0, S.ctx*2)}
    ], Math.min(700, S.out*2), null, null);
  }catch(e){ return {stato:"errore", motivo:e.message}; }
  if(!riassunto.trim()) return {stato:"errore", motivo:"riassunto vuoto"};

  /* si archivia SOLO ora: se il riassunto fallisce, la chat resta intatta */
  const prima = ctxTokens(c);
  const ids = new Set(blocco.map(m=>m.id));
  const pos = c.messages.findIndex(m => m.id === blocco[blocco.length-1].id);
  c.messages.forEach(m => { if(ids.has(m.id)) m.archived = true; });
  const sommario = {id:uid(), role:"system", kind:"summary", content:riassunto.trim(),
    compaction:{absorbed:blocco.length, before:prima, after:0}};
  c.messages.splice(pos+1, 0, sommario);
  sommario.compaction.after = ctxTokens(c);
  store();
  return {stato:"ok"};
}

/* ───────── invio ───────── */
async function invia(testo){
  const c = attiva() || nuova();
  c.messages.push({id:uid(), role:"user", content:testo});
  if(c.title === "Nuova chat") c.title = testo.slice(0,44) + (testo.length>44 ? "…" : "");
  render(); store();

  const soglia = (S.ctx - S.out) * TRIGGER;
  for(let g=0; g<3 && ctxTokens(c) > soglia; g++){
    const r = await compatta(c); render();
    if(r.stato !== "ok" || ctxTokens(c) <= (S.ctx - S.out) * TARGET) break;
  }

  const bozza = {id:uid(), role:"assistant", content:"", streaming:true};
  c.messages.push(bozza); render();
  const ac = new AbortController(); streaming = ac;
  $("stop").hidden = false; $("send").disabled = true;

  const payload = [{role:"system", content:S.sys}].concat(
    c.messages.filter(m=>!m.archived && !m.streaming && m.role!=="error")
      .map(m => ({role: m.kind==="summary" ? "system" : m.role, content:m.content})));
  try{
    await completa(payload, S.out, d => { bozza.content += d; renderStream(bozza); }, ac.signal);
    delete bozza.streaming;
  }catch(e){
    delete bozza.streaming;
    if(!bozza.content) c.messages.pop();
    const err = e instanceof ServerError ? e : new ServerError(0, (e && e.message) || e);
    c.messages.push({id:uid(), role:"error", content:err.message, hint: err.contesto
      ? "Il server dice che il contesto è troppo lungo. Abbassa «Finestra di contesto» finché non combacia con il valore di avvio del motore: se qui è più alto del reale, la compattazione parte troppo tardi."
      : "Controlla che il server risponda all'indirizzo impostato e che la chiave API sia corretta."});
  }finally{
    streaming = null; $("stop").hidden = true; $("send").disabled = false; render(); store();
  }
}

/* ───────── rendering ───────── */
function md(t){
  let h = esc(t);
  h = h.replace(/```([\s\S]*?)```/g, (m,c)=>"<pre><code>"+c.replace(/^\n/,"")+"</code></pre>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/^[•\-*]\s+/gm, "· ");
  return h.split(/\n{2,}/).map(p => "<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
}

function render(){
  const c = attiva();

  $("list").innerHTML = convs.map(x => `<button class="item" data-id="${x.id}" aria-current="${x.id===activeId}">
      <span class="item-name">${esc(x.title)}</span>
      <span class="item-n">${x.messages.filter(m=>!m.archived && m.role!=="error").length}</span></button>`).join("");
  $("list").querySelectorAll(".item").forEach(b => b.onclick = () => { activeId = b.dataset.id; render(); store(); });

  $("headTitle").textContent = c ? c.title : "";
  const collegato = !!S.url;
  $("host").innerHTML = `<span class="led ${collegato?"on":""}"></span>`
    + esc(collegato ? S.url.replace(/^https?:\/\//,"") : "dimostrativa");

  const usati = c ? ctxTokens(c) : 0, budget = Math.max(1, S.ctx - S.out), q = Math.min(1, usati/budget);
  const liv = q >= 0.9 ? "crit" : q >= TRIGGER ? "warn" : "";
  $("iPct").textContent = Math.round(q*100) + "%";
  $("iPct").className = "instr-pct" + (liv ? " "+liv : "");
  const lvl = $("iLvl");
  lvl.setAttribute("width", (q*188).toFixed(1));
  lvl.setAttribute("class", "lvl" + (liv ? " "+liv : ""));
  $("iRead").textContent = num(usati) + " / " + num(budget);
  const f = $("gFill");
  f.style.width = (q*100).toFixed(1)+"%";
  f.className = liv;
  $("gTick").style.left = (TRIGGER*100)+"%";

  const al = $("alarm");
  if(probed && probed.vera && S.ctx > probed.vera){
    al.hidden = false;
    al.innerHTML = `<b>Finestra disallineata.</b> Qui è impostata a ${num(S.ctx)} token ma il motore ne serve ${num(probed.vera)}: oltre quel limite taglia da sé, in silenzio, partendo dai messaggi più vecchi. Portala a ${num(probed.vera)}.`;
  } else al.hidden = true;

  const th = $("thread");
  if(!c){ th.innerHTML = ""; return; }
  th.classList.toggle("empty", !c.messages.length);
  if(!c.messages.length){
    th.innerHTML = `<div class="plate">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M1.5 11.5 A6.5 6.5 0 0 1 14.5 11.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        <line x1="8" y1="11.5" x2="11.6" y2="6.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <div class="plate-name">${esc((probed && probed.model) || S.model || "nessun modello collegato")}</div>
      <div class="plate-specs">
        <div><span class="tag">Finestra</span><b>${num(S.ctx)}</b></div>
        <div><span class="tag">Compatta a</span><b>${Math.round(TRIGGER*100)}%</b></div>
        <div><span class="tag">Risposta</span><b>${num(S.out)}</b></div>
      </div></div>`;
    return;
  }
  th.innerHTML = c.messages.filter(m=>!m.archived).map(m => {
    if(m.role === "error") return `<div class="fail">
        <div class="fail-t">Il server ha rifiutato la richiesta</div>
        <div class="fail-n">La conversazione è salva: nessun messaggio è stato perso.</div>
        <div class="fail-raw">${esc(m.content)}</div>
        <div class="fail-fix">${esc(m.hint||"")}</div></div>`;
    if(m.kind === "summary"){
      const k = m.compaction||{};
      return `<div class="ev mark-ev">contesto compattato · <b>${k.absorbed||0}</b> messaggi assorbiti · <b>${num(k.before)}</b> → <b>${num(k.after)}</b> token</div>
        <div class="memo"><span class="tag">Memoria conservata</span>${md(m.content)}</div>`;
    }
    return `<article class="turn ${m.role}${m.streaming?" live":""}" data-id="${m.id}">${md(m.content)}${m.streaming?'<span class="caret"></span>':""}
      <div class="meta"><span>${tok(m.content)} token</span><button data-copy="${m.id}">copia</button></div></article>`;
  }).join("");

  // Solo gli elementi mai visti prima entrano in scena: senza questo, ogni
  // ridisegno rianimerebbe l'intera trascrizione a ogni token in streaming.
  const visti = c._visti || (c._visti = new Set());
  th.querySelectorAll("[data-id]").forEach(el => {
    if(!visti.has(el.dataset.id)){ visti.add(el.dataset.id); el.classList.add("fresh"); }
  });

  th.querySelectorAll("[data-copy]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const m = c.messages.find(x => x.id === b.dataset.copy);
    navigator.clipboard && navigator.clipboard.writeText(m.content);
    b.textContent = "copiato"; setTimeout(()=>b.textContent="copia", 1200);
  });
  $("scroll").scrollTop = $("scroll").scrollHeight;
}

function renderStream(m){
  const el = document.querySelector(`.turn[data-id="${m.id}"]`);
  if(!el){ render(); return; }
  el.innerHTML = md(m.content) + '<span class="caret"></span>';
  const sc = $("scroll");
  if(sc.scrollHeight - sc.scrollTop - sc.clientHeight < 130) sc.scrollTop = sc.scrollHeight;
}

/* ───────── eventi ───────── */
$("input").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 190) + "px";
  const t = e.target.value.trim();
  $("draftTok").textContent = t ? tok(t) + " token nella bozza" : "";
  $("send").classList.toggle("armed", !!t);
});
$("input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); manda(); }
});
$("send").onclick = manda;
$("stop").onclick = () => streaming && streaming.abort();
function manda(){
  const t = $("input").value.trim();
  if(!t || streaming) return;
  $("input").value = ""; $("input").style.height = "auto";
  $("draftTok").textContent = ""; $("send").classList.remove("armed");
  invia(t);
}
$("newChat").onclick = () => { nuova(); render(); store(); $("input").focus(); };
$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem(LS+"-theme", next||""); }catch(e){}
};
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({convs, exported:new Date().toISOString()}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "conversazioni-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(Array.isArray(d.convs)){ convs = d.convs.concat(convs); activeId = convs[0].id; render(); store(); }
  }catch(err){ alert("File non leggibile: " + err.message); }
  e.target.value = "";
};

function apri(){
  $("sUrl").value = S.url; $("sKey").value = S.key; $("sApi").value = S.api;
  $("sModel").value = probed && probed.model ? probed.model : S.model;
  $("sCtx").value = S.ctx; $("sOut").value = S.out; $("sTemp").value = S.temp;
  $("sKeep").value = S.keep; $("sSys").value = S.sys;
  $("ctxNote").textContent = probed && probed.vera
    ? "Il motore ne serve " + num(probed.vera) + "." : "Deve combaciare con l'avvio del motore.";
  $("veil").hidden = false; $("sUrl").focus();
}
$("openSettings").onclick = apri;
$("closeSettings").onclick = $("cancelSettings").onclick = () => { $("veil").hidden = true; };
$("veil").addEventListener("click", e => { if(e.target === $("veil")) $("veil").hidden = true; });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("veil").hidden = true; });
$("saveSettings").onclick = async () => {
  S.url = $("sUrl").value.trim(); S.key = $("sKey").value; S.api = $("sApi").value;
  S.model = $("sModel").value.trim(); S.ctx = +$("sCtx").value || DEFAULTS.ctx;
  S.out = +$("sOut").value || DEFAULTS.out; S.temp = +$("sTemp").value;
  S.keep = Math.max(2, +$("sKeep").value || DEFAULTS.keep); S.sys = $("sSys").value;
  $("veil").hidden = true; store(); render();
  if(S.url){ await interroga(); render(); }
};
$("probeBtn").onclick = async () => {
  S.url = $("sUrl").value.trim(); S.key = $("sKey").value;
  const out = $("probeOut"); out.hidden = false; out.textContent = "interrogazione in corso…";
  if(!S.url){ out.textContent = "Nessun indirizzo impostato."; return; }
  const r = await interroga();
  if(!r || !r.api){ out.textContent = "Nessuna API riconosciuta a questo indirizzo.\nVerifica indirizzo, porta e che il server risponda."; return; }
  let t = "API: " + r.api + "\nmodello: " + (r.model || "non dichiarato") + "\n" + r.righe.join("\n");
  if(r.model) $("sModel").value = r.model;
  if(r.vera){
    const q = +$("sCtx").value;
    t += "\n\nfinestra reale del motore: " + num(r.vera);
    t += q > r.vera
      ? "\n\n⚠ Qui è impostata a " + num(q) + ", più del reale.\n   Il motore taglierebbe da sé, in silenzio. Corretta a " + num(r.vera) + "."
      : "\n\n✓ La finestra impostata sta dentro quella reale.";
    if(!q || q > r.vera) $("sCtx").value = r.vera;
  }
  out.textContent = t;
};

try{ const t = localStorage.getItem(LS+"-theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
if(!load() || !convs.length) esempio();
render();
if(S.url) interroga().then(render);
</script>
